[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp-core"
version = "0.4.0"
description = "Private best-of-class MCP server for SOLIDWORKS (Windows COM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.2,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.6,<3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
toolhive = ["mcp>=1.8,<2", "uvicorn>=0.31.1"]

[project.scripts]
solidworks-mcp-core = "solidworks_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solidworks: requires a running SOLIDWORKS session",
]
addopts = "-q"
