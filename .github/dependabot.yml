version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "mcp*"
          - "pydantic*"
          - "pillow*"
          - "pywin32*"
      python-dev:
        patterns:
          - "pytest*"
          - "build*"
      http-extra:
        patterns:
          - "uvicorn*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
