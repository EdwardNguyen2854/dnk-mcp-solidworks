[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnk-mcp-solidworks"
version = "0.1.0"
description = "Open-source MCP server that drives a running SOLIDWORKS session through its COM API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Edward Nguyen" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "solidworks",
    "cad",
    "com",
    "engineering",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.6,<3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
toolhive = ["mcp>=1.8,<3", "uvicorn>=0.31.1"]

[project.urls]
Homepage = "https://github.com/EdwardNguyen2854/dnk-mcp-solidworks"
Repository = "https://github.com/EdwardNguyen2854/dnk-mcp-solidworks"
Issues = "https://github.com/EdwardNguyen2854/dnk-mcp-solidworks/issues"
Changelog = "https://github.com/EdwardNguyen2854/dnk-mcp-solidworks/blob/main/CHANGELOG.md"
Documentation = "https://github.com/EdwardNguyen2854/dnk-mcp-solidworks/tree/main/docs"

[project.scripts]
dnk-mcp-solidworks = "solidworks_mcp.server:main"
solidworks-mcp-core = "solidworks_mcp.server:main"
solidworks-mcp = "solidworks_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-cad-house-standard" = [
  "skills/dnk-solidworks-cad-house-standard/SKILL.md",
]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-cad-remodel" = [
  "skills/dnk-solidworks-cad-remodel/SKILL.md",
]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-drawing-acceptance" = [
  "skills/dnk-solidworks-drawing-acceptance/SKILL.md",
]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-image-assisted-modeling" = [
  "skills/dnk-solidworks-image-assisted-modeling/SKILL.md",
]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-iso-engineering-drawing" = [
  "skills/dnk-solidworks-iso-engineering-drawing/SKILL.md",
]
"share/dnk-mcp-solidworks/skills/dnk-solidworks-sheet-layout" = [
  "skills/dnk-solidworks-sheet-layout/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solidworks: requires a running SOLIDWORKS session",
]
addopts = "-q"
